name: Deploy to GitHub Pages

# 推送到 main 即自动构建并发布；也可在 Actions 页面手动触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 官方部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个部署，新的推送取消进行中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 注意：npm run build 会先跑 scripts/gen-icons.mjs 生成图标与形状文件，
      # 因此 assets/cats/*.jpg（描摹用的参考图）必须一并提交进仓库。
      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
